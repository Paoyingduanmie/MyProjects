<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- No user-scalable=no: iOS ignores it anyway and Android honoring it
       blocks low-vision pinch zoom; touch-action:none on the canvas already
       prevents gameplay pinches. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <meta name="description" content="消消乐 — 禅境/闯关/每日/闪电/解谜五种模式的三消游戏">
  <title>消消乐</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .back-btn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);z-index:9999;width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(20,16,40,.55);color:#fff;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-tap-highlight-color:transparent;cursor:pointer}
    .back-btn:active{background:rgba(124,58,237,.55)}
  </style>
</head>
<body>
  <canvas id="game" role="application" aria-label="消消乐"></canvas>
  <!-- Screen-reader announcements (scene changes, results). The canvas is
       invisible to assistive tech; this is its voice. -->
  <div id="sr-live" aria-live="polite" role="status"></div>
  <div id="boot-splash">
    <div class="boot-gem"></div>
    <div class="boot-title">消消乐</div>
    <div class="boot-dots"><span></span><span></span><span></span></div>
  </div>
  <button class="back-btn" onclick="window.Bridge?Bridge.back():history.back()" aria-label="返回">‹</button>
  <script src="bundle.js"></script>
</body>
</html>
